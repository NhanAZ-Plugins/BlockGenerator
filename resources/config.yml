---
# Map server block names to positive, finite percentages that total 100.
# Legacy item IDs such as "1:0" are accepted when supported by the server parser.
# Weights below 0.1% may be hard to observe during gameplay.
blocks:
  "cobblestone": 25.0
  "cobbled_deepslate": 5.0
  "coal_ore": 9.0
  "deepslate_coal_ore": 8.0
  "copper_ore": 5.0
  "deepslate_copper_ore": 3.0
  "gold_ore": 8.0
  "deepslate_gold_ore": 7.0
  "diamond_ore": 6.0
  "deepslate_diamond_ore": 4.0
  "emerald_ore": 5.0
  "deepslate_emerald_ore": 3.0
  "redstone_ore": 5.0
  "deepslate_redstone_ore": 2.0
  "lapis_lazuli_ore": 3.0
  "deepslate_lapis_lazuli_ore": 2.0

# interact replaces water directly beside the fence.
# nonInteract fills an air gap beside the fence when water is two blocks away.
generatorMode: interact

# Play the server's fizz sound when a block is produced.
produceSound: false

# Skip generation when the relevant water is a source block.
checkSource: false

# Log a warning when a configured block weight is below 0.1%.
percentageWarning: true

# Delay generation by this many seconds. Zero places the block immediately.
delayTime: 0
...
